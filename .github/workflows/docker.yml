name: Publish iHost File Manager
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-qemu-action@v4
        with:
          platforms: arm
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/arm/v7
          load: true
          tags: ghcr.io/bzfrnd/ihost-filemanager:latest
      - name: Verify ARMv7 root access and configuration
        run: |
          docker run --rm --platform linux/arm/v7 --entrypoint /bin/sh ghcr.io/bzfrnd/ihost-filemanager:latest -c 'test "$(id -u)" = 0 && test -r /etc/ihost-filemanager.yaml && mkdir -p /srv/check && touch /srv/check/write-test && rm /srv/check/write-test'
      - name: Verify HTTP startup on ARMv7
        run: |
          docker run -d --name smoke --platform linux/arm/v7 -p 18080:80 ghcr.io/bzfrnd/ihost-filemanager:latest
          trap 'docker logs smoke; docker rm -f smoke' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://localhost:18080/ > /dev/null; then exit 0; fi
            sleep 2
          done
          exit 1
      - name: Publish verified image
        run: docker push ghcr.io/bzfrnd/ihost-filemanager:latest
